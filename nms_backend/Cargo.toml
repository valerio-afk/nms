[package]
name = "nms_backend"
version = "0.1.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"
non_camel_case_types = "allow"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.30", features = ["poll"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
tower-http = "0.6"
serde_json = "1.0"
