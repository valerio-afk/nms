[package]
name = "nms_backend"
version = "0.2.0-alpha"
edition = "2024"

[lints.rust]
non_snake_case = "allow"
non_camel_case_types = "allow"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3.0"
chrono = { version = "0.4", features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.30", features = ["poll"] }
axum = {version = "0.8.9", features = ["tracing","macros"] }
axum-auth = "0.8.1"
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6.1", features = ["trace"] }
tower_governor = "0.8.0"
serde_json = "1.0"
serde_repr = "0.1"
regex = "1.0"
strum = { version = "0.28", features = ["derive"] }
totp-rs = { version = "5", features = ["otpauth","gen_secret"] }
base64 = "0.23"
ipnet = "2.12"
configparser = "3.2"
futures = "0.3.33"
anyhow = "1.0"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
psutil = "3.3.0"
sysinfo = "0.39.6"
inventory = "0.3.24"
tokio-stream = { version = "0.1.19", features = ["fs"] }